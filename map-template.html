<!doctype html><html lang="de"><meta charset="utf-8"><title>Ausflugsziele</title><div id="map" style="height:100vh"></div><div style="position:absolute;top:12px;right:12px;z-index:1000;background:white;padding:9px;border-radius:8px;font:13px system-ui;box-shadow:0 2px 8px #0002"><span style="color:#1683d8">●</span> Ausflugsziele &nbsp; <span style="color:#e28b25">●</span> Ferienideen</div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const places=/*MAP_DATA*/[];const map=L.map('map').setView([46.75,8.4],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];for(const p of places){const a=document.createElement('a');a.href=p.url;a.textContent=p.title;a.target='_blank';L.circleMarker([p.lat,p.lon],{radius:9,color:'#fff',weight:2,fillColor:p.category==='Ferienideen'?'#e28b25':'#1683d8',fillOpacity:1}).addTo(map).bindPopup(a);bounds.push([p.lat,p.lon])}if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:11});</script></html>

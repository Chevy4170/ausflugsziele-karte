<!doctype html><html lang="de"><meta charset="utf-8"><title>Ausflugsziele</title><div id="map" style="height:100vh"></div><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const places=/*MAP_DATA*/[];const map=L.map('map').setView([46.75,8.4],7);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap'}).addTo(map);const bounds=[];for(const p of places){const a=document.createElement('a');a.href=p.url;a.textContent=p.title;a.target='_blank';L.marker([p.lat,p.lon]).addTo(map).bindPopup(a);bounds.push([p.lat,p.lon])}if(bounds.length)map.fitBounds(bounds,{padding:[30,30],maxZoom:11});</script></html>

name: Karte aktualisieren
on:
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *'
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install requests
      - name: Karte erzeugen
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        run: |
          test -n "$NOTION_API_KEY" || { echo 'NOTION_API_KEY fehlt'; exit 1; }
          python build_map.py
      - name: Karte speichern
        run: |
          cp site/index.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Karte aktualisieren'; git push; fi
